<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Listinha — Logo Horizontal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; background: transparent; }
  #root { width: 100%; min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 60px; box-sizing: border-box; }

  .word {
    font-family: "Titan One", system-ui, sans-serif;
    color: #241712;
    letter-spacing: -0.01em;
    font-size: 120px;
    line-height: 1;
    text-shadow: 4px 5px 0 #E8584A;
    -webkit-font-smoothing: antialiased;
  }

  @keyframes wheelspin { to { transform: rotate(360deg); } }
  @keyframes cartbob {
    0%   { transform: translateY(0)   rotate(-1.6deg); }
    50%  { transform: translateY(-6px) rotate(1.6deg); }
    100% { transform: translateY(0)   rotate(-1.6deg); }
  }
  @keyframes cartshadow {
    0%, 100% { transform: scaleX(1);   opacity: .16; }
    50%      { transform: scaleX(.82); opacity: .10; }
  }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.12); }
  }
  .cart-wheel  { animation: wheelspin .72s linear infinite; }
  .cart-bob    { transform-box: fill-box; transform-origin: center bottom; animation: cartbob .9s ease-in-out infinite; }
  .cart-shadow { transform-box: fill-box; transform-origin: center; animation: cartshadow .9s ease-in-out infinite; }
  .cart-eyes   { transform-box: fill-box; transform-origin: center; animation: blink 4.5s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .cart-wheel, .cart-bob, .cart-shadow, .cart-eyes { animation: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="logo.jsx"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById("root")).render(<LogoHorizontal fontSize={120} />);
</script>
</body>
</html>
