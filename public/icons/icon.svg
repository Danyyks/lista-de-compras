<svg width="512" height="512" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer stamp circle -->
  <circle cx="60" cy="60" r="55" stroke="#C8A4D4" stroke-width="3" fill="url(#gradient1)"/>

  <!-- Inner dashed circle -->
  <circle cx="60" cy="60" r="48" stroke="rgba(255, 252, 248, 0.5)" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

  <!-- Shopping basket icon -->
  <g transform="translate(35, 35)">
    <!-- Basket body -->
    <path d="M 10 20 L 15 45 L 35 45 L 40 20 Z" stroke="#FFFCF8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Basket handles -->
    <path d="M 17 20 Q 17 10, 25 10 Q 33 10, 33 20" stroke="#FFFCF8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Basket details -->
    <line x1="18" y1="25" x2="20" y2="40" stroke="#FFFCF8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="25" y1="25" x2="25" y2="40" stroke="#FFFCF8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="32" y1="25" x2="30" y2="40" stroke="#FFFCF8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Checkmark detail -->
    <path d="M 20 30 L 23 34 L 30 26" stroke="rgba(255, 252, 248, 0.6)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Decorative stars -->
  <g transform="translate(20, 15)">
    <path d="M 0 0 L 1 3 L 4 4 L 1 5 L 0 8 L -1 5 L -4 4 L -1 3 Z" fill="#F4B8C8" opacity="0.7"/>
  </g>
  <g transform="translate(95, 25)">
    <path d="M 0 0 L 1 3 L 4 4 L 1 5 L 0 8 L -1 5 L -4 4 L -1 3 Z" fill="#F4B8C8" opacity="0.7"/>
  </g>
  <g transform="translate(100, 85)">
    <path d="M 0 0 L 1.2 3.5 L 5 5 L 1.2 6.5 L 0 10 L -1.2 6.5 L -5 5 L -1.2 3.5 Z" fill="#EBD9C9" opacity="0.8"/>
  </g>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8A4D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F4B8C8;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
